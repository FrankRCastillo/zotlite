[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zotlite"
version = "0.1.0"
description = "A lightweight terminal UI for browsing and opening Zotero PDFs."
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
# This creates the terminal command 'zotlite' when installed
zotlite = "zotlite.cli:mainggVGd"
