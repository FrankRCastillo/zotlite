[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zotlite"
version = "0.2.0"
description = "A lightweight terminal UI for browsing and opening Zotero PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0.0"
]

[project.scripts]
zotlite = "zotlite.cli:main"
