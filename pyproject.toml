[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zotlite"
version = "0.3.0"
description = "A lightweight terminal UI and CLI for browsing, opening and searching Zotero PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0.0",
    "pymupdf>=1.24.3"
]

[project.scripts]
zotlite = "zotlite.cli:main"
